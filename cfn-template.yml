AWSTemplateFormatVersion: '2010-09-09'

Description: Roman Numerals Converter Flask Application

Parameters:
  KeyPairName:
    Description: Name of an existing EC2 KeyPair
    Type: AWS::EC2::KeyPair::KeyName

Resources:
  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP and SSH
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0fef201115eefe936
      InstanceType: t2.micro
      KeyName: !Ref KeyPairName

      SecurityGroupIds:
        - !GetAtt WebServerSecurityGroup.GroupId

      Tags:
        - Key: Name
          Value: !Sub "Web Server of ${AWS::StackName}"

      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          dnf update -y
          dnf install -y python3 python3-pip git
          pip3 install flask

          cd /home/ec2-user
          git clone https://github.com/sm2021praktikum/roman-numerals.git
          cd roman-numerals
          python3 app.py

Outputs:
  WebsiteURL:
    Description: Roman Numerals Converter Website
    Value: !Sub "http://${WebServer.PublicDnsName}"